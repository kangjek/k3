<!DOCTYPE html>
<html lang="id">
<head>
<title>Inspeksi K3</title>
<meta name="theme-color" content="#F1F4F0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspeksi K3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: satu kolom mobile (maks 560px). Header menempel di atas, tab bar tetap di bawah.
   Warna mengikuti sistem rambu ISO 7010: hijau = aman, merah = bahaya, kuning = waspada, biru = tindakan wajib.
   Hero hijau tua menampilkan Safe Man-Hours. Barlow Condensed untuk angka dan label (gaya rambu), IBM Plex Mono untuk kode alat. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E8EDE7; --line:#D5DDD4; --line-strong:#B9C5BA;
  --fg:#14231B; --fg-2:#46564D; --fg-3:#5B6A61;
  --primary:#1B4F9C; --on-primary:#FFFFFF; --primary-soft:#E1EAF8; --primary-text:#1B4F9C;
  --ok-solid:#17794D; --on-ok:#FFFFFF; --ok-soft:#DDF0E5; --ok-text:#0E6A41;
  --warn-solid:#8F5F00; --on-warn:#FFFFFF; --warn-soft:#FBEFCB; --warn-text:#7A5200;
  --danger-solid:#B3261E; --on-danger:#FFFFFF; --danger-soft:#FBE4E1; --danger-text:#A3201A;
  --hero-bg:#0F3A29; --hero-fg:#EAF6EF; --hero-fg-2:#A9C7B7; --hero-accent:#7DE3B0; --hero-line:#2B5844; --hero-danger:#FF9A90;
  --scrim:rgba(8,16,12,.55);
  --f-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1411; --surface:#15201B; --surface-2:#1D2B24; --line:#27372F; --line-strong:#3A4E44;
    --fg:#E6EEE9; --fg-2:#B0BFB6; --fg-3:#8C9C93;
    --primary:#7FAEF5; --on-primary:#0A1B36; --primary-soft:#172742; --primary-text:#9DC1FA;
    --ok-solid:#4CC38A; --on-ok:#05200F; --ok-soft:#133224; --ok-text:#6FD6A3;
    --warn-solid:#E3AE3C; --on-warn:#2A1E00; --warn-soft:#352A0C; --warn-text:#EBBF5E;
    --danger-solid:#FF8C82; --on-danger:#3A0B07; --danger-soft:#3A1816; --danger-text:#FFA39B;
    --hero-bg:#11382A; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#15201B; --surface-2:#1D2B24; --line:#27372F; --line-strong:#3A4E44;
  --fg:#E6EEE9; --fg-2:#B0BFB6; --fg-3:#8C9C93;
  --primary:#7FAEF5; --on-primary:#0A1B36; --primary-soft:#172742; --primary-text:#9DC1FA;
  --ok-solid:#4CC38A; --on-ok:#05200F; --ok-soft:#133224; --ok-text:#6FD6A3;
  --warn-solid:#E3AE3C; --on-warn:#2A1E00; --warn-soft:#352A0C; --warn-text:#EBBF5E;
  --danger-solid:#FF8C82; --on-danger:#3A0B07; --danger-soft:#3A1816; --danger-text:#FFA39B;
  --hero-bg:#11382A; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 15px/1.45 var(--f-body);background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:0px;z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,0px);padding-right:max(16px,0px)}
.mono{font-family:var(--f-mono);letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.lbl{font:600 14px/1.1 var(--f-disp);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2)}
.req{font:500 12px/1 var(--f-body);color:var(--fg-3)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:0px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:8px;padding-bottom:8px}
.top-t{flex:1;min-width:0}
.ttl{font:700 26px/1.05 var(--f-disp);letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl.mono{font:500 20px/1.2 var(--f-mono);text-transform:none}
.sub{font-size:13px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-proto{font:600 11px/1 var(--f-disp);letter-spacing:.1em;padding:4px 6px 3px;border:1px solid var(--line-strong);border-radius:4px;color:var(--fg-2)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);font:700 15px/1 var(--f-disp);letter-spacing:.04em}
.who{border:0;background:none;padding:3px;border-radius:50%;cursor:pointer}

/* main + tabs */
.main{padding-top:16px;padding-bottom:calc(104px + 0px)}
.main.noTabs{padding-bottom:calc(112px + 0px)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:0px}
.tabs-in{display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 9px;border:0;background:none;color:var(--fg-2);font:600 12px/1.1 var(--f-body);cursor:pointer;position:relative;min-height:60px}
.tab[aria-current=page]{color:var(--primary-text)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.tab .ic{width:24px;height:24px}
.tab.scan .bubble{display:grid;place-items:center;width:46px;height:34px;border-radius:17px;background:var(--primary);color:var(--on-primary)}
.tab.scan[aria-current=page]::before{display:none}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger-solid);color:var(--on-danger);font:700 11px/18px var(--f-body);text-align:center}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel.tap{cursor:pointer;width:100%;text-align:left}
button.panel{font:inherit}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 2px;border-radius:999px;font:600 12px/1.3 var(--f-body);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok-text)}
.pill.warn{background:var(--warn-soft);color:var(--warn-text)}
.pill.bad{background:var(--danger-soft);color:var(--danger-text)}
.pill.info{background:var(--primary-soft);color:var(--primary-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn.sm{min-height:42px;padding:0 14px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ok{background:var(--ok-solid);border-color:var(--ok-solid);color:var(--on-ok)}
.btn.danger{background:var(--danger-solid);border-color:var(--danger-solid);color:var(--on-danger)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[aria-disabled=true]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger-text);font-size:13px;min-height:18px}
.hint{font-size:13px;color:var(--fg-2)}
.note{padding:10px 12px;border-radius:10px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn-text)}
.note.info{background:var(--primary-soft);color:var(--primary-text)}
.empty{padding:26px 16px;text-align:center;color:var(--fg-2)}

/* forms */
label.l{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=number],input[type=month],input[type=date],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:78px;resize:vertical;line-height:1.4}
.field{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px}
.stepper input{text-align:center;font-variant-numeric:tabular-nums}
.stepper button{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font:600 22px/1 var(--f-body);cursor:pointer}
.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* login */
.login{min-height:100%;padding-top:48px;padding-bottom:40px}
.login h1{font:700 52px/.95 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.login .co{margin-top:8px;color:var(--fg-2)}
.demo-u{display:flex;flex-direction:column;gap:8px}
.demo-b{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px}
.demo-b .mono{font-size:13px;color:var(--fg-2)}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:14px;padding:16px 16px 12px}
.hero .lbl{color:var(--hero-accent)}
.hero-num{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.hero-num b{font:700 66px/.95 var(--f-disp);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero-num span{font:600 20px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--hero-fg-2)}
.hero-sub{margin-top:6px;color:var(--hero-fg-2);font-size:14px}
.spark{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.sp-base{stroke:var(--hero-line);stroke-width:1}
.sp-area{fill:var(--hero-accent);opacity:.16}
.sp-line{fill:none;stroke:var(--hero-accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.sp-end{fill:var(--hero-accent);stroke:var(--hero-bg);stroke-width:2}
.sp-lti{fill:var(--hero-danger);stroke:var(--hero-bg);stroke-width:2}
.spark-x{display:grid;margin-top:4px;font-size:12px;color:var(--hero-fg-2);text-align:center}
.spark-lg{margin-top:6px;font-size:12px;color:var(--hero-fg-2);display:flex;align-items:center;gap:6px}
.spark-lg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hero-danger)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hero-line)}
.hero-stats dt{font-size:12px;color:var(--hero-fg-2)}
.hero-stats dd{font:700 26px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.per{margin-top:8px;font-size:12px;color:var(--hero-fg-2)}

/* home cards */
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.triple div{min-width:0}
.triple b{display:block;font:700 34px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.triple span{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok-solid)}.dot.warn{background:var(--warn-solid)}.dot.bad{background:var(--danger-solid)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.bar i{display:block;height:100%}
.bar i.ok{background:var(--ok-solid)}.bar i.warn{background:var(--warn-solid)}.bar i.bad{background:var(--danger-solid)}
.pct{font:700 15px/1 var(--f-disp);letter-spacing:.04em;color:var(--fg-2);text-transform:uppercase;white-space:nowrap}
.big-pct{display:flex;align-items:baseline;gap:10px}
.big-pct b{font:700 48px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.cat{display:grid;grid-template-columns:minmax(0,1fr) 84px 38px;gap:10px;align-items:center;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.big-pct{margin-bottom:12px}
.cat .bar{margin:0;height:8px}
.cat .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rows>li{padding:12px 14px;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.act-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit}
button.act-row{cursor:pointer}
.act-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:none}
.act-ic.bad{background:var(--danger-soft);color:var(--danger-text)}
.act-ic.warn{background:var(--warn-soft);color:var(--warn-text)}
.act-ic.info{background:var(--primary-soft);color:var(--primary-text)}
.act-t{font-weight:600}
.act-d{font-size:13px;color:var(--fg-2)}

/* scan */
.finder{position:relative;display:grid;place-items:center;align-content:center;text-align:center;gap:10px;aspect-ratio:1/1;max-height:340px;width:100%;margin:0 auto;border:0;border-radius:14px;background:var(--surface-2);color:var(--fg);cursor:pointer;padding:20px}
.finder .c{position:absolute;width:34px;height:34px;border:4px solid var(--primary);}
.finder .c1{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.finder .c2{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.finder .c3{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.finder .c4{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.finder .big{width:44px;height:44px;color:var(--primary-text)}
.finder strong{font:700 24px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em}
.finder span.t{font-size:14px;color:var(--fg-2);max-width:230px}
details.dt{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.dt>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::after{content:"+";font:600 22px/1 var(--f-body);color:var(--fg-2)}
details.dt[open]>summary::after{content:"\2212"}
details.dt .dt-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sim button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px}
.sim button .mono{font-size:13px;font-weight:500}
.sim button small{color:var(--fg-2);font-size:12px}

/* inspection */
.alat-card{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--fg-2)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.chk-list{display:flex;flex-direction:column;gap:10px}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.chk.is-bad{background:var(--danger-soft);border-color:var(--danger-solid)}
.chk-q{display:flex;gap:10px;align-items:flex-start}
.chk-no{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--surface-2);font:600 13px/1 var(--f-mono);margin-top:1px}
.chk-q p{min-width:0}
.seg{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.seg-b{min-height:46px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;cursor:pointer}
.seg-b.on.seg-ok{background:var(--ok-solid);border-color:var(--ok-solid);color:var(--on-ok)}
.seg-b.on.seg-tidak-ok{background:var(--danger-solid);border-color:var(--danger-solid);color:var(--on-danger)}
.seg-b.on.seg-n-a{background:var(--fg-2);border-color:var(--fg-2);color:var(--bg)}
.chk-more{display:flex;flex-direction:column;gap:10px}
.submitbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + 0px)}
.submitbar .wrap{display:flex;align-items:center;gap:12px}
.sb-info{flex:1;min-width:0;font-size:13px;color:var(--fg-2)}
.sb-info strong{font:700 20px/1 var(--f-disp);color:var(--fg);font-variant-numeric:tabular-nums}
.sb-hint{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.discard{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px}
.done-ic{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok-text)}
.done-ic .ic{width:38px;height:38px;stroke-width:2.2}
.done h2{font:700 30px/1 var(--f-disp);text-transform:uppercase}

/* temuan */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.fchip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.fchip small{font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.trow{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.th{display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:8px;background:var(--surface-2);color:var(--fg-3);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.tb{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl .mono{font-size:13px;color:var(--fg-2)}
.td{font-weight:600;overflow-wrap:anywhere}
.tm{font-size:13px;color:var(--fg-2)}
.tl2{display:flex;flex-direction:column;gap:0;margin-top:4px}
.tl2 li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl2 li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.tl2 li:last-child::before{display:none}
.tl2 .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.tl2 .stp .mk{background:var(--ok-solid);border-color:var(--ok-solid);color:var(--on-ok)}
.tl2 .mk .ic{width:13px;height:13px;stroke-width:3}
.tl2 b{display:block}
.tl2 small{color:var(--fg-2);font-size:13px}
.fig{display:flex;flex-direction:column;gap:6px}
.fig img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fig figcaption{font-size:12px;color:var(--fg-2)}
.fig.ph{flex-direction:row;align-items:center;gap:8px;padding:12px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--fg-2);font-size:13px}

/* admin */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.tabs2 button{min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--fg-2);cursor:pointer}
.tabs2 button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:10px;background:var(--surface-2)}
.live dt{font-size:12px;color:var(--fg-2)}
.live dd{font:700 22px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font:600 13px/1.1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);border-top:0;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
.arow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.arow .mid{min-width:0;flex:1}
.arow .mono{font-size:14px;font-weight:500}
.arow small{display:block;color:var(--fg-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding-bottom:calc(20px + 0px);outline:0}
.sheet-in{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;z-index:1}
.sheet-h h2{font:700 22px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrbox{background:#fff;border-radius:10px;padding:8px;width:min(100%,280px);margin:0 auto;border:1px solid var(--line)}
.qr{display:block;width:100%;height:auto}
.url{font-family:var(--f-mono);font-size:12px;word-break:break-all;user-select:all;padding:10px;border-radius:8px;background:var(--surface-2);color:var(--fg-2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + 0px);z-index:60;width:min(calc(100% - 32px),520px);pointer-events:none}
#toast .t{margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast .t.err{background:var(--danger-solid);color:var(--on-danger)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}

.viewer{position:relative;aspect-ratio:1/1;max-height:360px;width:100%;margin:0 auto;border-radius:14px;overflow:hidden;background:#0B120F;color:#fff}
.viewer .slot,.viewer video{position:absolute;inset:0;width:100%;height:100%}
.viewer video{object-fit:cover;background:#0B120F}
.viewer .c{position:absolute;width:38px;height:38px;border:4px solid #fff;z-index:2;pointer-events:none}
.viewer .c1{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.viewer .c2{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.viewer .c3{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.viewer .c4{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.viewer .ln{position:absolute;top:12%;left:12%;right:12%;height:76%;overflow:hidden;z-index:2;pointer-events:none;opacity:0}
.viewer .ln::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent calc(100% - 2px),#7FE3A5 calc(100% - 2px))}
.viewer[data-s=live] .ln{opacity:.9}
.vmsg{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px;text-align:center;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.viewer:not([data-s=live]):not([data-s=starting]) .vmsg{top:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;background:rgba(11,18,15,.94)}
.vmsg p{margin:0;max-width:290px;line-height:1.45}
.vbtn{position:absolute;top:10px;right:10px;z-index:4;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(255,255,255,.65);background:rgba(0,0,0,.5);color:#fff;font:600 14px var(--f-body);cursor:pointer}
@media (prefers-reduced-motion:no-preference){
  .viewer[data-s=live] .ln::after{animation:sweep 2.4s ease-in-out infinite alternate}
  @keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(0)}}
}

<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ konfigurasi dan data awal */
const BOOT = (function(){var k=(new URLSearchParams(location.search).get('kode')||'').trim();return {kode:/^[A-Za-z0-9._-]{1,40}$/.test(k)?k.toUpperCase():'',company:''};})();            // diisi server: {kode dari QR, nama perusahaan}
const TOKEN_KEY = 'k3.token';
const DAY = 86400000;
let INTERVAL = {Harian:1, Mingguan:7, Bulanan:31, Tahunan:366};
let LATE_DAYS = 14, EXPIRY_DAYS = 30, RATE_BASE = 1000000;   // diganti oleh nilai dari sheet Config
const KATEGORI = ['Pemadam Kebakaran','Alat Kerja','P3K'];

/* ------------------------------------------------------------------ util */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const parseYM = p => { const a = p.split('-').map(Number); return new Date(a[0], a[1] - 1, 1); };
const parseYMD = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const daysBetween = (a, b) => Math.round((sod(b) - sod(a)) / DAY);
const nf0 = new Intl.NumberFormat('id-ID', {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtN = n => nf0.format(Math.round(n));
const fDate = new Intl.DateTimeFormat('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});
const fMonth = new Intl.DateTimeFormat('id-ID', {month: 'short', year: 'numeric'});
const fMon = new Intl.DateTimeFormat('id-ID', {month: 'short'});
const fTime = new Intl.DateTimeFormat('id-ID', {hour: '2-digit', minute: '2-digit'});
const fDT = d => fDate.format(d) + ', ' + fTime.format(d);
const rel = n => n <= 0 ? 'hari ini' : n === 1 ? 'kemarin' : n + ' hari lalu';
const slug = s => s.toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');
const ic = (n, c) => '<svg class="ic ' + (c || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';

/* ------------------------------------------------------------------ data dari Google Sheets (lewat Apps Script) */
let DB = null, TOKEN = null;
const FOTO = {};                                   // cache foto dari Drive (data URL)
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
function tokGet(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
function tokSet(v){ try{ if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
const API_URL = String(window.K3_API || '').trim();     // diisi di config.js bila halaman ini dihosting di luar Apps Script (mis. GitHub Pages)
async function rpcHttp(action, payload){
  if (!API_URL || API_URL.indexOf('ISI_DI_SINI') >= 0) throw Object.assign(new Error('Alamat API belum diisi. Isi K3_API di file config.js.'), {code: 'setup'});
  const ac = window.AbortController ? new AbortController() : null, to = ac ? setTimeout(() => ac.abort(), 90000) : 0;
  let res;
  try{
    res = await fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action, token: TOKEN || '', payload: payload || {}}), redirect: 'follow', credentials: 'omit', signal: ac ? ac.signal : undefined});
  }catch(e){ throw Object.assign(new Error('Koneksi bermasalah. Periksa sinyal lalu coba lagi.'), {code: 'net', detail: e && e.message}); }
  finally{ if (to) clearTimeout(to); }
  let r;
  try{ r = await res.json(); }
  catch(e){ throw Object.assign(new Error('Server tidak menjawab dengan benar. Pastikan deployment Apps Script: Who has access = Anyone.'), {code: 'net'}); }
  if (r && r.error){ const e = new Error(r.error); e.code = r.code; throw e; }
  return r ? r.data : null;
}
function rpc(action, payload){
  if (API_URL) return rpcHttp(action, payload);
  return new Promise((res, rej) => {
    if (!(window.google && google.script && google.script.run)) return rej(Object.assign(new Error('Halaman ini harus dibuka dari alamat webapp.'), {code: 'offline'}));
    google.script.run
      .withSuccessHandler(r => { if (r && r.error){ const e = new Error(r.error); e.code = r.code; rej(e); } else res(r ? r.data : null); })
      .withFailureHandler(e => rej(Object.assign(new Error('Koneksi bermasalah. Periksa sinyal lalu coba lagi.'), {code: 'net', detail: e && e.message})))
      .api(action, TOKEN || '', payload || {});
  });
}
function applyData(d){
  DB = d; const c = d.config;
  INTERVAL = c.intervals; LATE_DAYS = c.lateDays; EXPIRY_DAYS = c.expiryDays; RATE_BASE = c.rateBase; S.user = d.user;
}
async function refresh(){ applyData(await rpc('bootstrap')); }
const company = () => (DB && DB.config && DB.config.company) || BOOT.company || '';

/* ------------------------------------------------------------------ perhitungan (sama dengan rumus di template Excel) */
const jenisOf = n => DB.jenis.find(j => j.jenis === n);
const kategoriOf = a => (jenisOf(a.jenis) || {}).kategori || '';
const freqOf = a => a.frek || (jenisOf(a.jenis) || {}).frek || 'Bulanan';
const findAlat = k => { k = String(k || '').trim().toUpperCase(); return DB.alat.find(a => a.kode.toUpperCase() === k); };
const isAdmin = () => S.user && S.user.role === 'Admin K3';
function lastInsp(kode){ const a = findAlat(kode); return a && a.last ? a.last : null; }
function statusAlat(a){
  if (!a.aktif) return '';
  const last = lastInsp(a.kode);
  if (!last) return 'Belum Pernah';
  return daysBetween(new Date(last), new Date()) > INTERVAL[freqOf(a)] ? 'Terlambat' : 'Sesuai Jadwal';
}
function statRows(){
  const rows = DB.stat.slice().sort((a, b) => a.periode < b.periode ? -1 : 1);
  let smh = 0;
  return rows.map(r => {
    smh = r.lti > 0 ? 0 : smh + r.jam;
    return Object.assign({}, r, {smh, fr: r.jam ? r.lti * RATE_BASE / r.jam : null, sr: r.jam ? r.hh * RATE_BASE / r.jam : null});
  });
}
const umur = t => t.status === 'Closed' && t.tglVerif ? daysBetween(new Date(t.tgl), new Date(t.tglVerif)) : daysBetween(new Date(t.tgl), new Date());
function temuanCounts(){
  const c = {total: DB.temuan.length, open: 0, wait: 0, closed: 0, late: 0};
  DB.temuan.forEach(t => {
    if (t.status === 'Open') c.open++; else if (t.status === 'Menunggu Verifikasi') c.wait++; else c.closed++;
    if (t.status !== 'Closed' && umur(t) > LATE_DAYS) c.late++;
  });
  return c;
}
function compliance(){
  const act = DB.alat.filter(a => a.aktif);
  const r = {total: act.length, ok: 0, late: [], never: [], cat: {}, month: 0, expiring: []};
  r.month = DB.monthCount;
  act.forEach(a => {
    const s = statusAlat(a), k = kategoriOf(a) || 'Lainnya';
    r.cat[k] = r.cat[k] || {n: 0, ok: 0};
    r.cat[k].n++;
    if (s === 'Sesuai Jadwal'){ r.ok++; r.cat[k].ok++; }
    else if (s === 'Terlambat') r.late.push(a); else r.never.push(a);
    if (a.kadaluarsa && daysBetween(new Date(), parseYMD(a.kadaluarsa)) <= EXPIRY_DAYS) r.expiring.push(a);
  });
  return r;
}

/* ------------------------------------------------------------------ state */
const S = {user: null, tab: 'home', filter: 'Semua', adminTab: 'stat', sheet: null, insp: null, done: null, sheetFocused: false, boot: true, needPin: false, nikTmp: '', loginMsg: '', busy: false};
const PH = {};                                   // foto yang sedang diambil (data URL)
const clearPH = p => Object.keys(PH).forEach(k => { if (k.indexOf(p) === 0) delete PH[k]; });

/* ---- draf: isian yang sedang dikerjakan disimpan di HP supaya selamat dari muat ulang (kamera membuka aplikasi lain, browser kehabisan memori) */
const DRAFT_KEY = 'k3.draft', DRAFT_TTL = 12 * 3600 * 1000;
let draftTimer;
function draftData(){
  if (!S.user) return null;
  const d = {nik: S.user.nik, t: Date.now(), insp: null, sheet: null, ph: {}};
  if (S.insp){
    d.insp = {kode: S.insp.kode, ans: S.insp.ans, umum: S.insp.umum || '', reqId: S.insp.reqId};
    Object.keys(PH).forEach(k => { if (k.indexOf('i:') === 0) d.ph[k] = PH[k]; });
  } else if (S.sheet && S.sheet.type === 'temuan'){
    const k = 'tc:' + S.sheet.id;
    if (S.sheet.note || PH[k]){ d.sheet = {id: S.sheet.id, note: S.sheet.note || ''}; if (PH[k]) d.ph[k] = PH[k]; }
  }
  return (d.insp || d.sheet) ? d : null;
}
function saveDraftNow(){
  clearTimeout(draftTimer);
  if (S.boot || !S.user) return;                    // jangan hapus draf sebelum sempat dipulihkan
  const d = draftData();
  try{
    if (!d){ localStorage.removeItem(DRAFT_KEY); return; }
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); }
    catch(e){ d.ph = {}; localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); }     // penyimpanan penuh: simpan teks saja
  }catch(e){}
}
function saveDraftSoon(){ clearTimeout(draftTimer); draftTimer = setTimeout(saveDraftNow, 400); }
function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!d || !S.user || d.nik !== S.user.nik || !d.t || Date.now() - d.t > DRAFT_TTL) return null;
    return d;
  }catch(e){ return null; }
}
function restoreDraft(){
  const d = loadDraft(); if (!d) return false;
  if (d.insp){
    const kodeUrl = BOOT.kode ? parseKode(BOOT.kode).toUpperCase() : '';
    if (kodeUrl && kodeUrl !== d.insp.kode) return false;                 // QR lain baru dipindai: mulai dari awal
    const a = findAlat(d.insp.kode); if (!a || !a.aktif) return false;
    const items = DB.checklist.filter(c => c.jenis === a.jenis).sort((x, y) => x.no - y.no);
    if (!items.length) return false;
    const ans = {}; items.forEach(c => { if (d.insp.ans && d.insp.ans[c.id]) ans[c.id] = d.insp.ans[c.id]; });
    clearPH('i:'); Object.keys(d.ph || {}).forEach(k => { if (k.indexOf('i:') === 0) PH[k] = d.ph[k]; });
    S.insp = {kode: a.kode, items, ans, umum: d.insp.umum || '', reqId: d.insp.reqId || uuid()};
    BOOT.kode = ''; toast('Isian inspeksi ' + a.kode + ' dipulihkan. Lanjutkan dari sini.');
    return true;
  }
  if (d.sheet){
    const t = DB.temuan.find(x => x.id === d.sheet.id); if (!t || t.status !== 'Open') return false;
    clearPH('tc:'); Object.keys(d.ph || {}).forEach(k => { if (k.indexOf('tc:') === 0) PH[k] = d.ph[k]; });
    S.tab = 'temuan'; S.sheet = {type: 'temuan', id: t.id, note: d.sheet.note || ''};
    toast('Pengajuan close ' + t.id + ' dipulihkan.');
    return true;
  }
  return false;
}

let toastTimer;
function toast(msg, kind){
  const el = $('#toast'); if (!el) return;
  el.innerHTML = '<div class="t ' + (kind || '') + '">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; }, 3800);
}

/* ------------------------------------------------------------------ foto dan QR */
/* Foto kamera HP bisa 12-50 megapiksel. Jangan didekode penuh: di HP berRAM kecil browser mematikan tab,
   halaman dimuat ulang, dan isian hilang. Ukuran diperkecil sejak proses dekode. */
const dimsOf = im => ({w: im.naturalWidth || im.width, h: im.naturalHeight || im.height});
/* Lebar piksel asli dibaca dari header file (JPEG/PNG) tanpa mendekode gambar. */
async function peekWidth(file){
  try{
    const b = new Uint8Array(await file.slice(0, 262144).arrayBuffer());
    if (b[0] === 0xFF && b[1] === 0xD8){
      let i = 2;
      while (i + 9 < b.length){
        if (b[i] !== 0xFF){ i++; continue; }
        const m = b[i + 1];
        if (m === 0xFF){ i++; continue; }
        if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)){ i += 2; continue; }
        if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return (b[i + 7] << 8) | b[i + 8];
        i += 2 + ((b[i + 2] << 8) | b[i + 3]);
      }
    } else if (b[0] === 0x89 && b[1] === 0x50){ return ((b[16] << 24) | (b[17] << 16) | (b[18] << 8) | b[19]) >>> 0; }
  }catch(e){}
  return 0;
}
function viaImage(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => res({im, u});
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Image gagal dimuat')); };
    im.src = u;
  });
}
/* Beberapa cara, dari yang paling hemat memori. Bila satu gagal (HP lama / memori kecil), coba berikutnya. */
async function loadImg(file){
  const w = await peekWidth(file), tries = [];
  if (window.createImageBitmap){
    if (w > 1400 || (!w && file.size > 400000)) tries.push(['bitmap-kecil', () => createImageBitmap(file, {resizeWidth: 1280, resizeQuality: 'low'}).then(bm => ({im: bm, u: null}))]);
    tries.push(['bitmap', () => createImageBitmap(file).then(bm => ({im: bm, u: null}))]);
  }
  tries.push(['img', () => viaImage(file)]);
  const why = [];

const LV = {video: null, stream: null, raf: 0, on: false, starting: false, state: 'idle', msg: '', blocked: false, paused: false, torchOk: false, torchOn: false, det: null, cv: null, cx: null, last: 0, busy: false, seen: {}};

async function openCam(){

    {video: {facingMode: 'environment'}, audio: false},

function spark(rows){

  const pts = rows.map((r, i) => [x(i), y(r.smh)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const area = line + 'L' + pts[n - 1][0].toFixed(1) + ' ' + (H - bot) + 'L' + pts[0][0].toFixed(1) + ' ' + (H - bot) + 'Z';
  const lti = rows.map((r, i) => r.lti > 0 ? '<circle class="sp-lti" cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) + '" r="5"/>' : '').join('');
  const e = pts[n - 1], hasLti = rows.some(r => r.lti > 0);
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik Safe Man-Hours kumulatif ' + n + ' bulan terakhir, nilai terakhir ' + fmtN(rows[n - 1].smh) + ' jam">' +
    '<line class="sp-base" x1="0" y1="' + (H - bot) + '" x2="' + W + '" y2="' + (H - bot) + '"/><path class="sp-area" d="' + area + '"/><path class="sp-line" d="' + line + '"/>' + lti +
    '<circle class="sp-end" cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="5"/></svg>' +
    '<div class="spark-x" style="grid-template-columns:repeat(' + n + ',1fr)">' + rows.map(r => '<span>' + esc(fMon.format(parseYM(r.periode))) + '</span>').join('') + '</div>' +

}

    body = '<div class="qrbox">' + qrSvg(qrText(a.kode)) + '</div><div style="text-align:center"><div class="mono" style="font-size:18px">' + esc(a.kode) + '</div><div class="muted">' + esc(a.jenis) + ' · ' + esc(a.lokasi) + '</div></div>' +
      '<div class="stack-s"><span class="lbl">Isi QR</span><div class="url">' + esc(qrText(a.kode)) + '</div>' + (baseOk() ? '<p class="hint">Cetak QR ini dan tempel pada alat. Operator memindainya dengan kamera HP biasa.</p>'
        : '<div class="note warn"><strong>Alamat webapp belum terisi.</strong> Buka alamat webapp (/exec) sekali di browser atau isi Config &gt; Base_URL, lalu muat ulang halaman ini sebelum mencetak QR.</div>') + '</div>';
  } else if (s.type === 'user'){
    title = 'Akun'; text = 'Akun';
    body = '<dl class="kv"><dt>Nama</dt><dd>' + esc(S.user.nama) + '</dd><dt>NIK</dt><dd class="mono">' + esc(S.user.nik) + '</dd><dt>Peran</dt><dd>' + esc(S.user.role) + '</dd><dt>Bagian</dt><dd>' + esc(S.user.bagian) + '</dd></dl>' +
      '<button class="btn block" data-act="logout">' + ic('logout') + 'Keluar</button>';
  }
  return '<div class="scrim" data-act="close-sheet"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="' + esc(text) + '" tabindex="-1"><div class="wrap sheet-in"><div class="sheet-h"><h2>' + title + '</h2><button class="icon-btn" data-act="close-sheet" aria-label="Tutup">' + ic('x') + '</button></div>' + body + '</div></section>';
}

/* ------------------------------------------------------------------ render */
function render(opt){
  const y = window.scrollY, app = $('#app');
  if (!onScanView()) stopLive();
  if (S.boot){ app.innerHTML = loadingView(); return; }
  if (!S.user){
    app.innerHTML = loginView(); document.documentElement.style.overflow = '';
    const f = $(S.needPin ? '#pin' : '#nik'); if (f && S.needPin) f.focus({preventScroll: true});
    return;
  }
  let main, tabs = true;
  if (S.insp){ main = inspectView(); tabs = false; }
  else if (S.done){ main = doneView(); tabs = false; }
  else main = {home: homeView, scan: scanView, temuan: temuanView, admin: adminView}[S.tab]();
  app.innerHTML = headerHtml() + '<main class="wrap main ' + (tabs ? '' : 'noTabs') + '" id="main">' + main + '</main>' + (tabs ? tabsHtml() : '') + sheetHtml();
  document.documentElement.style.overflow = S.sheet ? 'hidden' : '';
  if (S.sheet && !S.sheetFocused){ const sh = $('#sheet'); if (sh) sh.focus({preventScroll: true}); S.sheetFocused = true; }
  if (!S.sheet) S.sheetFocused = false;
  if (S.tab === 'admin' && S.adminTab === 'stat' && !S.insp) livePreview();
  if (S.sheet && S.sheet.type === 'temuan') loadFotos();
  if (opt && opt.keep) window.scrollTo(0, y);
  if (onScanView()) mountLive();
  saveDraftSoon();
}
function go(tab, filter){
  S.tab = tab; S.sheet = null; S.done = null; S.insp = null;
  if (filter) S.filter = filter;
  render(); window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------ aksi */
function setBusy(b, on, label){
  if (!b) return;
  if (on){ b.dataset.l = b.textContent; b.textContent = label; b.setAttribute('aria-disabled', 'true'); S.busy = true; }
  else { if (b.dataset.l) b.textContent = b.dataset.l; b.setAttribute('aria-disabled', 'false'); S.busy = false; }
}
async function call(action, payload){
  try{ return await rpc(action, payload); }
  catch(e){ if (e.code === 'auth') forceLogout(e.message); throw e; }
}
function forceLogout(msg){
  TOKEN = null; tokSet(null); DB = null;
  Object.assign(S, {user: null, sheet: null, insp: null, done: null, needPin: false, nikTmp: '', loginMsg: msg || '', busy: false, boot: false});
  render(); window.scrollTo(0, 0);
}
function bootKode(){
  if (!BOOT.kode) return;
  const k = BOOT.kode; BOOT.kode = '';
  const e = startInspect(k); if (e) toast(e, 'err');
}
function enter(){
  Object.assign(S, {boot: false, tab: 'home', filter: 'Semua', needPin: false, nikTmp: '', loginMsg: '', busy: false});
  const back = restoreDraft();
  render(); window.scrollTo(0, 0);
  if (!back) bootKode();
}
async function login(nik, pin){
  if (S.busy) return;
  nik = String(nik || '').replace(/\s+/g, '');
  const err = $('#login-err'), btn = $('#login-btn');
  if (!nik){ if (err) err.textContent = 'Isi NIK terlebih dahulu.'; return; }
  if (S.needPin && !pin){ if (err) err.textContent = 'Isi PIN.'; return; }
  setBusy(btn, true, 'Memeriksa...');
  try{
    const r = await rpc('login', {nik, pin: pin || ''});
    S.busy = false;
    if (r.needPin){ S.needPin = true; S.nikTmp = nik; S.loginMsg = ''; render(); return; }
    TOKEN = r.token; tokSet(TOKEN);
    S.boot = true; render();
    await refresh();
    enter();
  }catch(e){
    S.busy = false; S.boot = false; S.nikTmp = nik; S.loginMsg = e.message; render();
  }
}
function startInspect(raw){
  const a = findAlat(parseKode(raw));
  if (!a) return 'Kode "' + parseKode(raw) + '" tidak terdaftar.';
  if (!a.aktif) return a.kode + ' berstatus tidak aktif.';
  const items = DB.checklist.filter(c => c.jenis === a.jenis).sort((x, y) => x.no - y.no);
  if (!items.length) return 'Checklist untuk ' + a.jenis + ' belum dibuat. Hubungi Admin K3.';
  clearPH('i:'); S.insp = {kode: a.kode, items, ans: {}, umum: '', reqId: uuid()}; S.sheet = null; S.done = null;
  render(); window.scrollTo(0, 0); return '';
}
function setAns(id, v){
  const x = S.insp.ans[id] = S.insp.ans[id] || {};
  x.ans = v; if (v !== 'Tidak OK'){ x.note = ''; delete PH['i:' + id]; }
  const c = S.insp.items.find(i => i.id === id), el = document.getElementById('chk-' + id);
  if (el){ const tmp = document.createElement('div'); tmp.innerHTML = itemHtml(c); el.replaceWith(tmp.firstChild); }
  updateSubmit();
}
async function submitInsp(){
  if (S.busy) return;
  const st = inspStatus();
  if (st.miss.length){
    toast(st.miss[0].t, 'err');
    const el = document.getElementById('chk-' + st.miss[0].id); if (el) el.scrollIntoView({block: 'center', behavior: 'smooth'});
    return;
  }
  const btn = $('#btn-submit'), a = findAlat(S.insp.kode);
  const payload = {reqId: S.insp.reqId, kode: a.kode, umum: (S.insp.umum || '').trim(),
    answers: S.insp.items.map(c => { const x = S.insp.ans[c.id]; return {butir: c.id, jawaban: x.ans, catatan: (x.note || '').trim(), foto: x.ans === 'Tidak OK' ? (PH['i:' + c.id] || null) : null}; })};
  setBusy(btn, true, 'Mengirim...');
  try{
    const r = await call('submitInspeksi', payload);
    S.done = {id: r.id, kode: a.kode, jenis: a.jenis, n: S.insp.items.length, temuan: r.temuan};
    S.insp = null; clearPH('i:'); S.busy = false;
    try{ await refresh(); }catch(e){}
    render(); window.scrollTo(0, 0); saveDraftNow();
  }catch(e){ setBusy(btn, false); toast(e.message, 'err'); }
}
async function writeThen(btn, busyLabel, fn, onOk, errEl){
  if (S.busy) return;
  setBusy(btn, true, busyLabel);
  try{
    const r = await fn();
    S.busy = false;
    try{ await refresh(); }catch(e){}
    onOk(r);
  }catch(e){
    setBusy(btn, false);
    if (errEl) errEl.textContent = e.message; else toast(e.message, 'err');
  }
}
const ACT = {
  'login-back'(){ Object.assign(S, {needPin: false, nikTmp: '', loginMsg: ''}); render(); },
  logout(){ rpc('logout').catch(() => {}); forceLogout(''); },
  user(){ S.sheet = {type: 'user'}; render({keep: true}); },
  goto(b){ go(b.dataset.tab, b.dataset.filter); },
  pick(b){ saveDraftNow(); if (/^scanfile/.test(b.dataset.target)){ LV.paused = true; stopLive(); } const f = document.getElementById(b.dataset.target); if (f) f.click(); },
  torch(){ toggleTorch(); },
  'live-retry'(){ LV.blocked = false; LV.paused = false; startLive(); },
  'open-scan'(){ saveDraftNow(); const f = $('#scanfile'); if (f) f.click(); },
  ans(b){ setAns(b.dataset.id, b.dataset.v); },
  'ans-all'(){ S.insp.items.forEach(c => { const x = S.insp.ans[c.id]; if (!x || !x.ans) S.insp.ans[c.id] = {ans: 'OK'}; }); render({keep: true}); },
  'insp-back'(){
    if (!Object.keys(S.insp.ans).length && !S.insp.umum){ clearPH('i:'); S.insp = null; S.tab = 'scan'; render(); window.scrollTo(0, 0); }
    else { const d = $('#discard'); d.hidden = false; d.scrollIntoView({block: 'nearest'}); }
  },
  'insp-keep'(){ $('#discard').hidden = true; },
  'insp-discard'(){ clearPH('i:'); S.insp = null; S.tab = 'scan'; render(); window.scrollTo(0, 0); },
  'submit-insp'(){ submitInsp(); },
  'done-scan'(){ go('scan'); },
  'done-home'(){ go('home'); },
  filter(b){ S.filter = b.dataset.f; render({keep: true}); },
  'open-temuan'(b){ clearPH('tc:'); S.sheet = {type: 'temuan', id: b.dataset.id}; render({keep: true}); },
  'close-sheet'(){ S.sheet = null; clearPH('tc:'); render({keep: true}); },
  ajukan(b){
    const id = b.dataset.id, note = ($('#tc-note').value || '').trim(), err = $('#tc-err');
    if (!note){ err.textContent = 'Isi catatan perbaikan.'; return; }
    if (!PH['tc:' + id]){ err.textContent = 'Foto perbaikan wajib diambil.'; return; }
    writeThen(b, 'Mengirim...', () => call('ajukanClose', {id, catatan: note, foto: PH['tc:' + id]}), () => {
      clearPH('tc:'); S.sheet = null; render({keep: true}); toast('Pengajuan close terkirim. Menunggu verifikasi Admin K3.');
    }, err);
  },
  setuju(b){
    const id = b.dataset.id;
    writeThen(b, 'Menyimpan...', () => call('verifikasi', {id, setuju: true, catatan: ($('#tv-note').value || '').trim()}), () => {
      S.sheet = null; render({keep: true}); toast('Temuan ' + id + ' ditutup.');
    }, $('#tv-err'));
  },
  tolak(b){
    const id = b.dataset.id, note = ($('#tv-note').value || '').trim();
    if (!note){ $('#tv-err').textContent = 'Tulis alasan penolakan agar petugas tahu yang perlu diperbaiki.'; return; }
    writeThen(b, 'Menyimpan...', () => call('verifikasi', {id, setuju: false, catatan: note}), () => {
      S.sheet = null; render({keep: true}); toast('Temuan ' + id + ' dikembalikan ke Open.');
    }, $('#tv-err'));
  },
  'admin-tab'(b){ S.adminTab = b.dataset.t; render({keep: true}); },
  step(b){
    const i = document.getElementById(b.dataset.t); i.value = Math.max(0, (parseInt(i.value, 10) || 0) + parseInt(b.dataset.d, 10)); livePreview();
  },
  'show-qr'(b){ S.sheet = {type: 'qr', kode: b.dataset.kode}; render({keep: true}); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (!S.user && b.dataset.act !== 'login-back') return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'nik' || t.id === 'pin'){ const er = $('#login-err'); if (er) er.textContent = ''; S.loginMsg = ''; }
  else if (t.dataset && t.dataset.note && S.insp){ (S.insp.ans[t.dataset.note] = S.insp.ans[t.dataset.note] || {}).note = t.value; updateSubmit(); }
  else if (t.id === 'umum' && S.insp) S.insp.umum = t.value;
  else if (t.id === 'tc-note' && S.sheet) S.sheet.note = t.value;
  else if (t.closest && t.closest('#statform')) livePreview();
  saveDraftSoon();
});
window.addEventListener('pagehide', saveDraftNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraftNow(); });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.photo){
    const f = t.files && t.files[0]; if (!f) return;
    try{ PH[t.dataset.photo] = await compress(f); refreshPhoto(t.dataset.photo); if (t.dataset.photo.indexOf('i:') === 0) updateSubmit(); saveDraftNow(); }
    catch(err){ toast('Foto tidak dapat diproses (memori HP penuh?). Tutup aplikasi lain lalu coba lagi.' + (err && err.why ? ' [' + err.why + ']' : ''), 'err'); }
    t.value = '';
  } else if (t.id === 'scanfile' || t.id === 'scanfile2'){
    const f = t.files && t.files[0]; if (!f) return;
    toast('Membaca QR...');
    try{
      const txt = await decodeQR(f);
      if (!txt) toast('QR tidak terbaca. Dekatkan kamera dan pastikan QR utuh dan terang.', 'err');
      else { const er = startInspect(txt); if (er) toast(er, 'err'); else $('#toast').innerHTML = ''; }
    }catch(err){ toast(err.message === 'lib' ? 'Pemindai QR belum termuat. Periksa koneksi internet.' : 'Foto tidak dapat dibaca. Coba lagi.', 'err'); }
    t.value = ''; resumeLive();
  } else if (t.id === 'f-periode'){
    const rows = statRows(), p = t.value, ex = rows.find(r => r.periode === p), prev = rows.filter(r => r.periode < p).pop();
    const set = (id, v) => { document.getElementById(id).value = v; };
    const v = ex || {tk: prev ? prev.tk : '', jam: prev ? prev.jam : '', lti: 0, hh: 0, nm: 0};
    set('f-tk', v.tk); set('f-jam', v.jam); set('f-lti', v.lti); set('f-hh', v.hh); set('f-nm', v.nm);
    $('#stat-btn').textContent = (ex ? 'Perbarui' : 'Simpan') + ' statistik'; livePreview();
  } else if (t.id === 'a-jenis'){ $('#a-kode').value = nextKode(t.value); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id, sbtn = e.target.querySelector('button[type=submit]');
  if (id === 'loginform') login($('#nik').value, $('#pin') ? $('#pin').value : '');
  else if (id === 'kodeform'){ const v = $('#kode').value.trim(); if (!v){ $('#kode-err').textContent = 'Ketik kode alat terlebih dahulu.'; return; } const er = startInspect(v); if (er) $('#kode-err').textContent = er; }
  else if (id === 'statform'){
    const g = k => parseInt(document.getElementById(k).value, 10), p = $('#f-periode').value, err = $('#stat-err');
    const r = {periode: p, tk: g('f-tk'), jam: g('f-jam'), lti: g('f-lti'), hh: g('f-hh'), nm: g('f-nm')};
    if (!p){ err.textContent = 'Pilih periode.'; return; }
    if ([r.tk, r.jam, r.lti, r.hh, r.nm].some(n => isNaN(n) || n < 0)){ err.textContent = 'Isi semua kolom dengan angka 0 atau lebih.'; return; }
    if (r.jam === 0){ err.textContent = 'Jam kerja belum diisi.'; return; }
    writeThen(sbtn, 'Menyimpan...', () => call('saveStatistik', r), () => {
      const cur = statRows().find(x => x.periode === p); render({keep: true});
      toast('Statistik ' + fMonth.format(parseYM(p)) + ' tersimpan. Safe Man-Hours ' + fmtN(cur ? cur.smh : 0) + ' jam.');
    }, err);
  }
  else if (id === 'alatform'){
    const v = k => document.getElementById(k).value.trim(), err = $('#a-err'), kode = v('a-kode').toUpperCase();
    if (!kode || !v('a-lok')){ err.textContent = 'Kode alat dan lokasi wajib diisi.'; return; }
    writeThen(sbtn, 'Menyimpan...', () => call('addAlat', {kode, jenis: v('a-jenis'), merk: v('a-merk'), area: v('a-area'), lokasi: v('a-lok'), pic: v('a-pic'), kadaluarsa: v('a-kad')}), () => {
      render({keep: true}); toast('Alat ' + kode + ' ditambahkan. Ketuk ikon QR untuk mencetak labelnya.');
    }, err);
  }
  else if (id === 'jenisform'){
    const v = k => document.getElementById(k).value.trim(), err = $('#j-err'), nama = v('j-nama'), pre = v('j-pre').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const qs = v('j-q').split('\n').map(x => x.trim()).filter(Boolean);
    if (!nama || !pre){ err.textContent = 'Nama jenis dan awalan kode wajib diisi.'; return; }
    if (!qs.length){ err.textContent = 'Tulis minimal satu butir checklist.'; return; }
    writeThen(sbtn, 'Menyimpan...', () => call('addJenis', {jenis: nama, kategori: v('j-kat'), prefix: pre, frek: v('j-frek'), pertanyaan: qs}), () => {
      render({keep: true}); toast('Jenis ' + nama + ' ditambahkan dengan ' + qs.length + ' butir checklist.');
    }, err);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) ACT['close-sheet'](); });

/* ------------------------------------------------------------------ mulai */
(async function start(){
  render();                                  // layar "Memuat data"
  TOKEN = tokGet();
  if (TOKEN){
    try{ await refresh(); enter(); return; }
    catch(e){ if (e.code === 'auth'){ TOKEN = null; tokSet(null); } else S.loginMsg = e.message; }
  }
  S.boot = false; render();
  if (!BOOT.company) rpc('info').then(d => {           // nama perusahaan untuk layar login (halaman di luar Apps Script tidak menerimanya dari server)
    if (d && d.company){ BOOT.company = d.company; const n = $('#nik'); if (!S.user && !S.boot && n && !n.value) render(); }
  }).catch(() => {});
})();
})();
</script>
